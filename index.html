  <style>
    html,body{background:#0b0d12;height:100%;margin:0;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
    canvas{display:block}
    #hud{pointer-events:none;color:#fff;text-shadow:0 1px 3px #000c;position:fixed;inset:0}
    #perf{opacity:.6;font:600 11px 'Segoe UI',system-ui,sans-serif;font-variant-numeric:tabular-nums;position:absolute;top:14px;right:22px}
    /* экран загрузки в стиле тугэ-аркады */
    #loading{position:fixed;inset:0;display:grid;place-items:center;color:#fff;z-index:50;
      background:radial-gradient(ellipse at 50% 60%,#1c2130 0%,#0b0d12 70%)}
    #loading .logo{font:900 italic clamp(56px,11vw,128px)/1 'Segoe UI Black','Arial Black',Impact,sans-serif;letter-spacing:.02em;
      background:linear-gradient(100deg,#ff8a1a,#ff4a1f 55%,#ff2d3d);-webkit-background-clip:text;background-clip:text;color:transparent;
      filter:drop-shadow(0 6px 24px rgba(255,80,30,.35))}
    #loading .kanji{font:700 clamp(18px,3vw,30px)/1 system-ui,sans-serif;color:rgba(255,255,255,.75);margin-left:.4em;vertical-align:.9em}
    #loading .bar{width:min(320px,60vw);height:4px;margin:26px auto 12px;background:rgba(255,255,255,.1);overflow:hidden;transform:skewX(-12deg)}
    #loading .bar i{display:block;width:40%;height:100%;background:linear-gradient(90deg,#ff8a1a,#ff2d3d);animation:ld 1.1s ease-in-out infinite}
    #loading .txt{text-align:center;font:800 12px 'Segoe UI',system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.6)}
    @keyframes ld{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
